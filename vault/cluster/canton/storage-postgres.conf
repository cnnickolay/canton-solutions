// Postgres storage, one database per node on the local Postgres.
_pg {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties {
      serverName = "localhost"
      portNumber = "5432"
      user = "canton"
      password = "canton"
    }
  }
  parameters {
    migrate-and-start = true
    max-connections = 32
  }
}
_storage {
  sequencer = ${_pg} { config.properties.databaseName = "sequencer" }
  mediator = ${_pg} { config.properties.databaseName = "mediator" }
  participant = ${_pg} { config.properties.databaseName = "participant" }
}
