// The synchronizer: one BFT sequencer and one mediator in one process.
canton {
  sequencers.sequencer1 {
    storage = ${_storage.sequencer}
    public-api { address = "0.0.0.0", port = 5001 }
    admin-api { address = "127.0.0.1", port = 5002 }
    sequencer.type = BFT
  }
  mediators.mediator1 {
    storage = ${_storage.mediator}
    admin-api { address = "127.0.0.1", port = 5202 }
  }
}
