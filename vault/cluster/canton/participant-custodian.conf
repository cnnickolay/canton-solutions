// The custodian participant. The JSON Ledger API listens on every interface,
// so the benchmark driver on the synchronizer host can reach it.
canton {
  participants.custodian {
    storage = ${_storage.participant}
    admin-api { address = "127.0.0.1", port = 5012 }
    ledger-api { address = "0.0.0.0", port = 5011 }
    http-ledger-api { address = "0.0.0.0", port = 5013 }
  }
}
